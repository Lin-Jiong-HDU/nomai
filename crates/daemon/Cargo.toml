[package]
name = "nomai-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Nomai daemon — JSON-RPC over stdio + native MCP server for personal knowledge management"
keywords = ["nomai", "daemon", "knowledge", "mcp", "json-rpc"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "nomai-daemon"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
nomai-protocol = { path = "../protocol", version = "0.4" }
nomai-core = { path = "../core", version = "0.4" }
nomai-providers = { path = "../providers", version = "0.4" }
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
dashmap = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = "1"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "sync", "net", "signal", "time", "process"] }
toml = "0.8"
directories = "5"
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
jsonschema = { workspace = true }
base64 = "0.22"
