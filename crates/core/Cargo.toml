[package]
name = "nomai-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Storage, indexing, and retrieval services for nomai — a SQLite-backed knowledge core"
keywords = ["nomai", "knowledge", "notes", "rag", "sqlite"]
categories = ["database", "text-processing"]

[dependencies]
nomai-protocol = { path = "../protocol", version = "0.3" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
refinery = { version = "0.8", features = ["rusqlite"] }
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
sqlite-vec = "0.1"
tempfile = "3"
