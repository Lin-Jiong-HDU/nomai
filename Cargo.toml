[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/core",
    "crates/providers",
    "crates/daemon",
]

[workspace.package]
edition = "2024"
version = "0.2.1"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Lin-Jiong-HDU/nomai"
homepage = "https://github.com/Lin-Jiong-HDU/nomai"
authors = ["JohnLin <linjiong2020@outlook.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04"] }
jsonschema = "0.22"
